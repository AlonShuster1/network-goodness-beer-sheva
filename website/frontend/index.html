<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Network Goodness — Beer Sheva</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.03);
      --radius: 10px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    #app { display: flex; flex-direction: column; height: 100vh; }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    header .title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    header .subtitle { font-size: 13px; color: var(--text-muted); }

    main { flex: 1 1 auto; display: flex; min-height: 0; }

    #map { flex: 1 1 auto; }

    #sidebar {
      width: 380px;
      flex: 0 0 380px;
      border-left: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 0 0 10px;
    }

    .empty {
      font-size: 13px;
      color: var(--text-muted);
      padding: 6px 0;
    }

    /* Compact metric row: L, K, inertia */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }
    .metric .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }
    .metric .value {
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }
    .metric .unit { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-left: 2px; }

    /* 2x2 grid of formula scores */
    .scores-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .score {
      background: var(--accent-soft);
      border: 1px solid #e0e7ff;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .score .label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .score .value {
      font-size: 22px;
      font-weight: 600;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
      line-height: 1.1;
    }
    .score .value .pct {
      font-size: 14px;
      color: var(--accent);
      opacity: 0.7;
      margin-left: 1px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    button {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    button:hover { background: #f1f5f9; }
    button:active { background: #e2e8f0; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      grid-column: span 2;
    }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    button.primary:active { background: #3730a3; }
    button.danger { color: var(--danger); border-color: #fecaca; background: var(--danger-soft); }
    button.danger:hover { background: #fee2e2; }

    .msg {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 18px;
      padding: 4px 2px;
      margin-bottom: 8px;
    }
    .msg.err { color: var(--danger); }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    th, td { padding: 6px 8px; text-align: right; }
    th {
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    td { border-bottom: 1px solid var(--border); color: var(--text); }
    tr:last-child td { border-bottom: none; }
    th:first-child, td:first-child { text-align: left; }
    tbody tr:hover td { background: #f8fafc; }
    .swatch {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      vertical-align: middle;
      border-radius: 50%;
    }

    /* Leaflet visual tweaks */
    .leaflet-container { background: #eef2f5; }
    .leaflet-control-attribution { font-size: 10px !important; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="title">Network Goodness</div>
      <div class="subtitle">Beer Sheva</div>
    </header>

    <main>
      <div id="map"></div>
      <aside id="sidebar">

        <div class="card">
          <div class="card-title">Current network</div>
          <div id="scores"><div class="empty">Click the map to add the first node.</div></div>
        </div>

        <div class="card">
          <div class="card-title">Actions</div>
          <div class="buttons">
            <button id="btn-save" class="primary">Save Snapshot</button>
            <button id="btn-new">New Network</button>
            <button id="btn-undo">Undo Last Node</button>
            <button id="btn-clear" class="danger" style="grid-column: span 2;">Clear Saved Snapshots</button>
          </div>
          <div class="msg" id="msg"></div>
        </div>

        <div class="card">
          <div class="card-title">Saved snapshots</div>
          <table id="snap-table">
            <thead>
              <tr>
                <th>Ver</th><th>L</th><th>K</th><th>Nodes</th>
                <th>F3</th><th>F4</th><th>F5</th><th>F6</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <div class="empty" id="snap-empty">No snapshots saved yet.</div>
        </div>

      </aside>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (function () {
    const SERVER_BASE = (location.protocol === "http:" || location.protocol === "https:")
      ? ""
      : "http://127.0.0.1:8765";
    const API_URL = SERVER_BASE + "/api/calculate";
    const HOODS_URL = SERVER_BASE + "/hoods.json";
    const MAP_CENTER = [31.24524, 34.78958];
    const MAP_ZOOM = 13;
    const EDIT_COLOR = "#dc2626";
    const SNAPSHOT_COLORS = ["#16a34a", "#ea580c", "#9333ea", "#2563eb", "#0891b2", "#be123c", "#0d9488", "#a16207"];

    const map = L.map("map").setView(MAP_CENTER, MAP_ZOOM);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap",
    }).addTo(map);

    let editMarkers = [];
    let editLine = null;
    let latestScores = null;
    let savedSnapshots = [];
    let savedLayers = [];

    fetch(HOODS_URL)
      .then((r) => r.json())
      .then((polys) => {
        const hoodColor = "#64748b";
        polys.forEach((coords) => {
          L.polygon(coords, {
            color: hoodColor,
            fillColor: hoodColor,
            fillOpacity: 0.07,
            weight: 1,
            opacity: 0.5,
          }).addTo(map);
        });
      })
      .catch((e) => setMsg("Failed to load neighborhood polygons: " + e, true));

    function getCurrentNodes() {
      return editMarkers.map((m) => {
        const ll = m.getLatLng();
        return [ll.lat, ll.lng];
      });
    }

    function setMsg(text, isError) {
      const el = document.getElementById("msg");
      el.textContent = text || "";
      el.className = "msg" + (isError ? " err" : "");
    }

    function renderScores() {
      const el = document.getElementById("scores");
      const n = editMarkers.length;
      if (n === 0) {
        el.innerHTML = "<div class='empty'>Click the map to add the first node.</div>";
        return;
      }
      if (n < 2) {
        el.innerHTML = "<div class='empty'>1 node placed — add at least one more to compute scores.</div>";
        return;
      }
      if (!latestScores) {
        el.innerHTML = "<div class='empty'>Calculating…</div>";
        return;
      }
      const s = latestScores;
      el.innerHTML =
        "<div class='metrics'>" +
          "<div class='metric'><div class='label'>L</div><div class='value'>" + s.L.toFixed(2) + "<span class='unit'>km</span></div></div>" +
          "<div class='metric'><div class='label'>K</div><div class='value'>" + s.K + "</div></div>" +
          "<div class='metric'><div class='label'>Inertia</div><div class='value'>" + s.network_inertia.toFixed(1) + "</div></div>" +
        "</div>" +
        "<div class='scores-grid'>" +
          scoreCard("Formula 3", s.score3) +
          scoreCard("Formula 4", s.score4) +
          scoreCard("Formula 5", s.score5) +
          scoreCard("Formula 6", s.score6) +
        "</div>";
    }

    function scoreCard(label, value) {
      return "<div class='score'><div class='label'>" + label + "</div>" +
             "<div class='value'>" + value.toFixed(2) + "<span class='pct'>%</span></div></div>";
    }

    function redrawEditLine() {
      if (editLine) {
        map.removeLayer(editLine);
        editLine = null;
      }
      const nodes = getCurrentNodes();
      if (nodes.length >= 2) {
        editLine = L.polyline(nodes, { color: EDIT_COLOR, weight: 4, opacity: 0.9 }).addTo(map);
      }
    }

    let inflight = 0;
    function refreshScores() {
      const nodes = getCurrentNodes();
      if (nodes.length < 2) {
        latestScores = null;
        renderScores();
        return;
      }
      const myReq = ++inflight;
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nodes: nodes, points: [] }),
      })
        .then((r) => {
          if (!r.ok) return r.text().then((t) => { throw new Error(r.status + " " + t); });
          return r.json();
        })
        .then((data) => {
          if (myReq !== inflight) return;
          latestScores = data;
          renderScores();
          setMsg("");
        })
        .catch((e) => {
          if (myReq !== inflight) return;
          setMsg("API error: " + e.message, true);
        });
    }

    function addMarker(lat, lon) {
      const marker = L.marker([lat, lon], { draggable: true, title: "Node " + (editMarkers.length + 1) }).addTo(map);
      marker.on("dragend", () => { redrawEditLine(); refreshScores(); });
      marker.on("drag", () => { redrawEditLine(); });
      editMarkers.push(marker);
      retitleMarkers();
      redrawEditLine();
    }

    function retitleMarkers() {
      editMarkers.forEach((m, i) => {
        m.options.title = "Node " + (i + 1);
        if (m._icon) m._icon.title = "Node " + (i + 1);
      });
    }

    function drawSnapshotLayer(nodes, color) {
      const line = L.polyline(nodes, { color: color, weight: 3, opacity: 0.7 }).addTo(map);
      savedLayers.push(line);
      return line;
    }

    function renderSnapTable() {
      const tbody = document.querySelector("#snap-table tbody");
      const empty = document.getElementById("snap-empty");
      const table = document.getElementById("snap-table");
      tbody.innerHTML = "";
      if (savedSnapshots.length === 0) {
        table.style.display = "none";
        empty.style.display = "block";
        return;
      }
      table.style.display = "";
      empty.style.display = "none";
      savedSnapshots.forEach((s) => {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td><span class='swatch' style='background:" + s.color + "'></span>" + s.version + "</td>" +
          "<td>" + s.L.toFixed(2) + "</td>" +
          "<td>" + s.K + "</td>" +
          "<td>" + s.nodes.length + "</td>" +
          "<td>" + s.score3.toFixed(2) + "</td>" +
          "<td>" + s.score4.toFixed(2) + "</td>" +
          "<td>" + s.score5.toFixed(2) + "</td>" +
          "<td>" + s.score6.toFixed(2) + "</td>";
        tbody.appendChild(tr);
      });
    }

    map.on("click", (e) => {
      addMarker(e.latlng.lat, e.latlng.lng);
      refreshScores();
    });

    document.getElementById("btn-save").addEventListener("click", () => {
      const nodes = getCurrentNodes();
      if (nodes.length < 2) { setMsg("Add at least 2 nodes before saving.", true); return; }
      if (!latestScores) { setMsg("No score yet — wait for calculation to finish.", true); return; }
      const version = savedSnapshots.length + 1;
      const color = SNAPSHOT_COLORS[(version - 1) % SNAPSHOT_COLORS.length];
      savedSnapshots.push({
        version: version, color: color, nodes: nodes,
        L: latestScores.L, K: latestScores.K, network_inertia: latestScores.network_inertia,
        score3: latestScores.score3, score4: latestScores.score4,
        score5: latestScores.score5, score6: latestScores.score6,
      });
      drawSnapshotLayer(nodes, color);
      renderSnapTable();

      // Clear the editable network so the next click starts a fresh one
      // instead of extending the just-saved polyline.
      editMarkers.forEach((m) => map.removeLayer(m));
      editMarkers = [];
      if (editLine) { map.removeLayer(editLine); editLine = null; }
      latestScores = null;
      renderScores();

      setMsg("Saved snapshot #" + version + ". Click the map to start a new network.");
    });

    document.getElementById("btn-new").addEventListener("click", () => {
      editMarkers.forEach((m) => map.removeLayer(m));
      editMarkers = [];
      if (editLine) { map.removeLayer(editLine); editLine = null; }
      latestScores = null;
      renderScores();
      setMsg("Started a new network. Saved snapshots are still on the map.");
    });

    document.getElementById("btn-undo").addEventListener("click", () => {
      if (editMarkers.length === 0) { setMsg("Nothing to undo."); return; }
      const last = editMarkers.pop();
      map.removeLayer(last);
      retitleMarkers();
      redrawEditLine();
      refreshScores();
      setMsg("Removed last node.");
    });

    document.getElementById("btn-clear").addEventListener("click", () => {
      savedLayers.forEach((l) => map.removeLayer(l));
      savedLayers = [];
      savedSnapshots = [];
      renderSnapTable();
      setMsg("Cleared all saved snapshots.");
    });

    renderScores();
    renderSnapTable();
  })();
  </script>
</body>
</html>
